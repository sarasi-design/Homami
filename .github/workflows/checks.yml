# Homami's automatic checks. They run on every pull request and every change to main,
# and show a ✓ or ✗ on GitHub. Nothing here touches the real Supabase, Stripe or live app.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (lint, types, unit tests, build, browser tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check (strict TypeScript)
        run: npm run typecheck
      - name: Unit tests (money, dates, messages)
        run: npm test
      - name: Build
        run: npm run build
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests on a phone-sized screen
        run: npm run test:e2e

  database:
    name: Database rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Setup scripts and the rules, tried as pretend people
        run: ./scripts/test-database.sh
